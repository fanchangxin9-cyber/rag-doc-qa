<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG 文档问答</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --muted-light: #9ca3af;
    --border: #e5e7eb;
    --brand: #16a34a;
    --brand-dark: #15803d;
    --user-bubble: #dcfce7;
    --bot-bubble: #f3f4f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .lead { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 999px;
    background: var(--brand);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
  }
  input[type="file"] {
    font: inherit;
    font-size: 14px;
  }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--brand); }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: var(--brand);
    color: #fff;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: var(--brand-dark); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .status { font-size: 13px; color: var(--muted); margin: 12px 0 0; min-height: 20px; }
  .status.ok { color: var(--brand-dark); }
  .status.err { color: #b91c1c; }
  #messages { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  /* 答案里可能有换行，所以换行交给里面的 .answer 处理，气泡本身用普通排版 */
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; word-break: break-word; white-space: normal; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot-bubble); border-bottom-left-radius: 4px; }
  .answer { white-space: pre-wrap; }
  .empty { color: var(--muted); font-size: 14px; }
  .doc-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .doc-item { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  .doc-count { color: var(--muted); }
  .doc-del { border: 1px solid var(--border); background: var(--card); color: var(--muted); border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
  .doc-del:hover { color: #b91c1c; border-color: #b91c1c; }
  .doc-empty { font-size: 13px; color: var(--muted); }
  .sources { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 8px; }
  .sources-hd { font-size: 12px; color: var(--muted); }
  .source { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; transition: box-shadow .2s, border-color .2s; }
  .source-hd { font-size: 13px; font-weight: 500; color: var(--brand-dark); margin-bottom: 4px; }
  .source-text { font-size: 13px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }

  /* ============ 引用溯源相关样式 ============ */

  /* 答案里的引用标签，例如 [1] */
  .cite {
    display: inline-block; padding: 0 5px; margin: 0 1px; border-radius: 4px;
    border: 1px solid var(--brand); background: var(--user-bubble);
    color: var(--brand-dark); font: inherit; font-size: 12px; line-height: 18px;
    cursor: pointer; vertical-align: 1px;
  }
  .cite:hover { background: var(--brand); color: #fff; }

  /* 被引用过的来源卡片：边框变绿 */
  .source.cited { border-color: var(--brand); }
  /* 从引用标签跳过来时闪一下 */
  .source.flash { box-shadow: 0 0 0 3px rgba(22, 163, 74, .25); }

  /* 来源原文默认折成 3 行，"展开全文"按钮切换 */
  .source-text.clamped {
    display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .source-toggle {
    margin-top: 6px; padding: 2px 10px; font-size: 12px; color: var(--muted);
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    font-weight: 400; cursor: pointer;
  }
  .source-toggle:hover { background: var(--bg); }

  /* 重排模型没就绪时的黄色提示条 */
  .src-note {
    font-size: 12px; color: #b45309; background: #fffbeb;
    border: 1px solid #fde68a; border-radius: 8px; padding: 8px 10px;
  }

  /* 历史会话列表 */
  .hist-list { display: flex; flex-direction: column; gap: 6px; }
  /* 一行 = 一个容器 + 里面两个按钮（"打开"和"删除"）。
     为什么不把整行做成一个按钮？因为 HTML 不允许按钮套按钮 ——
     嵌套的按钮会被浏览器拆开，点击行为也就乱了。 */
  .hist-item {
    display: flex; align-items: center;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card);
    padding-right: 4px;
  }
  .hist-item:hover { background: var(--bg); }
  /* 当前正在聊的这个会话高亮，免得用户不知道自己在哪一条里 */
  .hist-item.active { border-color: var(--brand); background: var(--user-bubble); }
  .hist-open {
    flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px;
    text-align: left; padding: 7px 4px 7px 10px;
    background: none; border: 0; cursor: pointer;
    font-family: inherit; font-size: 13px; color: var(--text);
  }
  .hist-open .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-open .m { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .hist-del {
    border: 1px solid transparent; background: none; color: var(--muted-light);
    border-radius: 5px; padding: 2px 7px; font-size: 12px; cursor: pointer; line-height: 1.4;
  }
  .hist-del:hover { color: #b91c1c; border-color: #b91c1c; background: #fef2f2; }
  .hist-empty { font-size: 13px; color: var(--muted); }

  /* 删除会话的确认弹窗 —— 自己做一个，因为原生 window.confirm 塞不进"不再提醒"勾选框 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .35);
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  /* [hidden] 属性默认是 display:none，但上面写了 display:flex 会盖掉它，
     所以必须显式补一句，否则"隐藏"会失效 */
  .modal-mask[hidden] { display: none; }
  .modal {
    background: var(--card); border-radius: 12px; padding: 18px 20px;
    width: min(420px, calc(100vw - 32px)); box-shadow: 0 10px 40px rgba(0, 0, 0, .2);
  }
  .modal h3 { margin: 0 0 10px; font-size: 15px; color: var(--text); }
  .modal-target {
    margin: 0 0 10px; padding: 8px 10px; background: var(--bg); border-radius: 6px;
    font-size: 13px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .modal-warn { margin: 0 0 12px; font-size: 12px; color: #b45309; }
  .modal-skip {
    display: flex; align-items: center; gap: 6px; margin-bottom: 14px;
    font-size: 12px; color: var(--muted); cursor: pointer;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn-danger {
    background: #b91c1c; color: #fff; border: 0; border-radius: 8px;
    padding: 8px 14px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .btn-danger:hover { background: #991b1b; }

  /* ============ 本次「流式 + 多轮对话」新增的样式 ============ */

  /* 正在流式输出时，答案末尾挂一个闪烁光标 */
  .msg.bot.streaming .answer::after {
    content: '▍';
    color: var(--brand);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* 「思考中…」：等模型第一个字时显示的浅色提示，三个点轮流亮 */
  .thinking {
    color: var(--muted-light);          /* 浅色，不抢眼 */
    font-size: 14px;
    user-select: none;
  }
  .thinking .dot {
    opacity: .25;                       /* 暗着的状态 */
    animation: dotFade 1.4s infinite;
  }
  /* nth-child 只数"元素"，文字节点不算 —— 所以 1/2/3 正好是三个点 */
  .thinking .dot:nth-child(2) { animation-delay: .2s; }
  .thinking .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes dotFade {
    0%, 60%, 100% { opacity: .25; }     /* 大部分时间是暗的 */
    30%           { opacity: 1; }       /* 亮一下就过去，形成"跑马灯"感 */
  }

  /* 「新对话」按钮：次要样式，别抢主按钮的视觉 */
  .btn-ghost {
    margin-left: auto;                 /* h2 是 flex，这一下把它推到最右边 */
    padding: 4px 12px; font-size: 13px; font-weight: 400;
    color: var(--muted); background: var(--card);
    border: 1px solid var(--border); border-radius: 6px;
  }
  .btn-ghost:hover { background: var(--bg); color: var(--text); }

  /* 流结束时显示的一行小字：本轮用量 + 记忆占用 */
  .ctx-line {
    margin: 10px 0 0;
    font-size: 12px;
    color: var(--muted-light);
    min-height: 18px;              /* 先占好位置，出现时不跳一下 */
  }
  .ctx-line.full { color: #b45309; }   /* 记忆装满了 → 换成提醒色 */

  /* ============ 「模型设置」折叠面板 ============ */
  .settings summary {
    cursor: pointer;
    font-size: 15px; font-weight: 500;
    display: flex; align-items: center; gap: 8px;
    list-style: none;
  }
  .settings summary::-webkit-details-marker { display: none; }   /* 去掉浏览器自带的三角 */
  .settings summary::before {
    content: '▸'; color: var(--muted); transition: transform .15s;
  }
  .settings[open] summary::before { transform: rotate(90deg); }
  .settings summary .cur {
    margin-left: auto; font-size: 12px; color: var(--muted-light); font-weight: 400;
  }
  .settings-body { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .lbl { font-size: 13px; color: var(--muted); width: 64px; flex: none; }
  select, input[type="password"] {
    flex: 1; min-width: 0; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px; font: inherit;
    outline: none; background: var(--card); color: var(--text);
  }
  select:focus, input[type="password"]:focus { border-color: var(--brand); }
  .hint { font-size: 12px; color: var(--muted-light); margin: 0; }
  .btn-line {
    padding: 10px 18px; font-size: 14px; font-weight: 400;
    color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .btn-line:hover { background: var(--bg); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>RAG 文档问答</h1>
    <p class="lead">上传文档（PDF / Word / Markdown / TXT），然后基于它们的内容提问。答案会一个字一个字显示出来，并标注引用编号——点编号可以跳回原文核对。同一个会话里可以接着追问。</p>

    <section class="card">
      <h2><span class="step">1</span>上传文档</h2>
      <div class="row">
        <input type="file" id="file" accept=".pdf,.docx,.md,.markdown,.txt">
        <button id="uploadBtn">上传并入库</button>
      </div>
      <p class="status" id="uploadStatus">选择文档（PDF / Word / Markdown / TXT）后点击上传。</p>
      <div id="docList" class="doc-list"></div>
    </section>

    <section class="card">
      <h2>
        <span class="step">2</span>提问
        <button id="newChatBtn" type="button" class="btn-ghost">新对话</button>
      </h2>
      <div id="messages"><p class="empty">还没有对话。先上传文档，然后在这里提问。</p></div>
      <form class="row" id="askForm">
        <input type="text" id="question" placeholder="输入你的问题，例如：这份文档的核心结论是什么？" autocomplete="off">
        <button type="submit" id="askBtn">提问</button>
      </form>
      <p class="ctx-line" id="ctxLine"></p>
    </section>

    <section class="card">
      <details class="settings" id="histCard" open>
        <summary>历史会话<span class="cur" id="histCount"></span></summary>
        <div class="settings-body">
          <div id="histList" class="hist-list"></div>
        </div>
      </details>
    </section>

    <section class="card">
      <details class="settings">
        <summary>模型设置<span class="cur" id="curModel"></span></summary>
        <div class="settings-body">
          <div class="row">
            <label class="lbl" for="presetSel">服务商</label>
            <select id="presetSel"></select>
          </div>
          <p class="hint" id="presetHint"></p>
          <div class="row">
            <label class="lbl" for="setBaseUrl">接口地址</label>
            <input type="text" id="setBaseUrl" placeholder="https://...">
          </div>
          <div class="row">
            <label class="lbl" for="setModel">模型名</label>
            <input type="text" id="setModel" placeholder="例如 glm-4.7-flash">
          </div>
          <div class="row">
            <label class="lbl" for="setApiKey">API Key</label>
            <input type="password" id="setApiKey" autocomplete="off" placeholder="粘贴你的密钥">
          </div>
          <p class="hint">密钥只保存在你本机的 settings.json 里（已排除在 git 之外），网页上永远不会把它显示出来。</p>
          <div class="row">
            <button type="button" id="testBtn" class="btn-line">测试连接</button>
            <button type="button" id="saveBtn">保存</button>
          </div>
          <p class="status" id="settingsStatus"></p>
        </div>
      </details>
    </section>
  </div>

  <!-- 删除会话的确认弹窗。
       为什么不用 window.confirm？因为那是浏览器自带的框，我们往里面塞不了
       "本次不再提醒"这个勾选框。所以自己做一个，样式也跟页面一致。 -->
  <div class="modal-mask" id="delModal" hidden>
    <div class="modal">
      <h3>确定删掉这条会话吗？</h3>
      <p class="modal-target" id="delModalTarget"></p>
      <p class="modal-warn">里面的问答记录会被一起清掉，删了就找不回来了。</p>
      <label class="modal-skip">
        <input type="checkbox" id="delModalSkip">
        本次不再提醒（下次打开页面会重新提醒）
      </label>
      <div class="modal-actions">
        <button type="button" id="delModalCancel" class="btn-line">取消</button>
        <button type="button" id="delModalOk" class="btn-danger">确定删除</button>
      </div>
    </div>
  </div>

<script>
  const fileInput = document.getElementById('file');
  const uploadBtn = document.getElementById('uploadBtn');
  const uploadStatus = document.getElementById('uploadStatus');
  const askForm = document.getElementById('askForm');
  const askBtn = document.getElementById('askBtn');
  const questionInput = document.getElementById('question');
  const messages = document.getElementById('messages');
  const docList = document.getElementById('docList');
  const newChatBtn = document.getElementById('newChatBtn');
  const ctxLine = document.getElementById('ctxLine');
  const histList = document.getElementById('histList');
  const histCount = document.getElementById('histCount');
  const delModal = document.getElementById('delModal');
  const delModalTarget = document.getElementById('delModalTarget');
  const delModalSkip = document.getElementById('delModalSkip');
  const delModalOk = document.getElementById('delModalOk');
  const delModalCancel = document.getElementById('delModalCancel');

  // 会话编号：本次谈话的"身份证"，后端靠它把同一会话的前几轮串起来。
  //
  // 为什么存在 localStorage、而不是每次刷新都新生成一个？
  //   因为记忆现在存在服务端的 SQLite 里，活得好好的 —— 但页面上要是每次加载
  //   都换一个新编号，就等于换了个人去问话，服务端存的历史一条也用不上。
  //   存进 localStorage 之后，刷新页面（以及服务重启）都还是同一个会话，
  //   之前聊过的内容就能接着用。
  const SESSION_KEY = 'rag_session_id';
  let sessionId = localStorage.getItem(SESSION_KEY) || crypto.randomUUID();
  localStorage.setItem(SESSION_KEY, sessionId);

  function setStatus(text, type) {
    uploadStatus.textContent = text;
    uploadStatus.className = 'status' + (type ? ' ' + type : '');
  }

  function addMessage(text, who) {
    const empty = messages.querySelector('.empty');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    div.textContent = text;
    messages.appendChild(div);
    return div;
  }

  // ============================================================
  // 历史会话：列出、进入、把聊天记录还原出来
  // ============================================================
  // 为什么要有这一块？
  //   记忆是存在服务端的（SQLite），但页面刷新之后聊天区是空的 ——
  //   于是出现"模型记得、用户却看不见"的怪状况：它能接着上一轮聊，
  //   人却想不起来上一轮到底聊了啥。这里把历史拉回来渲染，两边就对齐了。
  function mkText(text, cls) {
    const el = document.createElement('span');
    if (cls) el.className = cls;
    el.textContent = text;          // 一律 textContent，绝不拼 HTML
    return el;
  }

  function relTime(ts) {
    if (!ts) return '';
    const s = Math.floor(Date.now() / 1000 - ts);
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    return Math.floor(s / 86400) + ' 天前';
  }

  async function loadSessionList() {
    let list = [];
    try {
      const res = await fetch('/sessions');
      const data = await res.json();
      list = (data && data.sessions) || [];
    } catch (e) {
      histList.innerHTML = '';
      histList.appendChild(mkText('读不到历史会话清单。', 'hist-empty'));
      return;
    }

    histCount.textContent = list.length ? '共 ' + list.length + ' 个' : '';
    histList.innerHTML = '';
    if (list.length === 0) {
      histList.appendChild(mkText('还没有历史会话。问过问题之后，这里会列出来。', 'hist-empty'));
      return;
    }

    list.forEach(function (s) {
      const row = document.createElement('div');
      // 当前正在聊的这个高亮，免得用户不知道自己"站在哪一条会话里"
      row.className = 'hist-item' + (s.session_id === sessionId ? ' active' : '');

      const open = document.createElement('button');
      open.type = 'button';
      open.className = 'hist-open';
      open.appendChild(mkText(s.preview || '（无内容）', 't'));
      open.appendChild(mkText(relTime(s.updated_at) + ' · ' + s.message_count + ' 条', 'm'));
      open.addEventListener('click', function () { switchSession(s.session_id); });

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'hist-del';
      del.textContent = '删除';
      del.title = '删掉这条会话（连同里面的全部问答）';
      del.addEventListener('click', function () { deleteSession(s.session_id, s.preview); });

      row.appendChild(open);
      row.appendChild(del);
      histList.appendChild(row);
    });
  }

  function renderHistory(list) {
    messages.innerHTML = '';
    if (!list || list.length === 0) {
      messages.innerHTML = '<p class="empty">还没有对话。先上传文档，然后在这里提问。</p>';
      return;
    }
    // 历史里只存了问答原文，没存当时的资料 —— 所以 [n] 还原出来只是普通文字、点不动
    list.forEach(function (m) {
      addMessage(m.content, m.role === 'user' ? 'user' : 'bot');
    });
    messages.lastChild.scrollIntoView({ block: 'end' });
  }

  async function loadHistory() {
    try {
      const res = await fetch('/sessions/' + encodeURIComponent(sessionId) + '/messages');
      const data = await res.json();
      renderHistory((data && data.messages) || []);
    } catch (e) {
      // 拉不到就当空会话处理，别让一个网络抖动把页面卡住
    }
  }

  async function switchSession(id) {
    sessionId = id;
    localStorage.setItem(SESSION_KEY, sessionId);   // 切了就记住，刷新后还在这一条
    ctxLine.textContent = '';                        // 用量行说的是"上一轮"，换会话先清掉
    await loadHistory();
    await loadSessionList();                         // 重画，把高亮挪到新的这条上
  }

  // ============================================================
  // 删除确认弹窗
  // ============================================================
  // 为什么自己做一个、不用 window.confirm？
  //   原生弹窗上塞不了"本次不再提醒"这个勾选框 —— 想加这个功能就必须自己画。
  //
  // 「不再提醒」为什么用一个普通变量、不存 localStorage？
  //   因为要求是"本次使用不再提醒，下次进入网页再提醒"。
  //   localStorage 会一直记着，下次进来也不提醒了 —— 不符合要求。
  //   普通变量活在当前页面里，一刷新/重开就归零，正好就是"下次再提醒"。
  let skipDeleteConfirm = false;
  let delModalResolve = null;      // 弹窗关掉时要"回话"给当初等它的人

  function confirmDelete(preview) {
    return new Promise(function (resolve) {
      delModalResolve = resolve;
      delModalTarget.textContent = preview || '（无内容）';
      // 每次弹出都从"没勾"开始 —— 免得上次手滑勾过，这次连确认都没有就删了
      delModalSkip.checked = false;
      delModal.hidden = false;
      delModalOk.focus();
    });
  }

  function closeDeleteModal(answer) {
    delModal.hidden = true;
    if (delModalResolve) {
      const finish = delModalResolve;     // 先存下来再清空，避免重复调用
      delModalResolve = null;
      finish(answer);
    }
  }

  delModalOk.addEventListener('click', function () {
    if (delModalSkip.checked) skipDeleteConfirm = true;   // 勾了就本次不再问
    closeDeleteModal(true);
  });
  delModalCancel.addEventListener('click', function () { closeDeleteModal(false); });
  delModal.addEventListener('click', function (e) {
    if (e.target === delModal) closeDeleteModal(false);   // 点灰色遮罩 = 取消
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !delModal.hidden) closeDeleteModal(false);   // 按 Esc = 取消
  });

  async function deleteSession(id, preview) {
    // 「本次不再提醒」勾过之后就直接删，不再弹窗（刷新页面会恢复提醒）
    if (!skipDeleteConfirm) {
      const ok = await confirmDelete(preview);
      if (!ok) return;
    }

    try {
      // 后端本来就有这个能力：/session/reset 会把消息和会话一起清掉，不用新加接口
      await fetch('/session/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: id }),
      });
    } catch (e) {
      // 网络失败就先不管：列表待会儿会重新拉，状态自然对得上
    }

    if (id === sessionId) {
      // 删的正好是当前这条 —— 换一个新编号，聊天区清空，免得继续聊到一条已经不存在的记录
      sessionId = crypto.randomUUID();
      localStorage.setItem(SESSION_KEY, sessionId);
      ctxLine.textContent = '';
      messages.innerHTML = '<p class="empty">还没有对话。先上传文档，然后在这里提问。</p>';
    }

    await loadSessionList();
  }

  // ============================================================
  // 引用溯源：把答案里的 [n] 变成可点击标签
  // ============================================================
  // 安全提醒：这里【绝不能】用 innerHTML 拼模型输出的内容。
  // 模型吐什么我们就渲染什么，万一它吐出一段 <script> 就被执行了。
  // 所以一律用 createElement + textContent —— 这两个 API 会把内容当"纯文字"，
  // 尖括号、引号都会被原样显示出来，不会被当成 HTML 解析。
  function renderAnswer(answerEl, text, sourcesBox) {
    answerEl.textContent = '';
    const cited = [];

    // 按 [数字] 切开，分隔符本身也保留在数组里（正则带括号会有这个效果）
    const parts = text.split(/(\[\d+\])/);
    parts.forEach(function (part) {
      const m = part.match(/^\[(\d+)\]$/);
      if (m) {
        const n = Number(m[1]);
        const hit = sourcesBox.querySelector('.source[data-index="' + n + '"]');
        if (hit) {                              // 只把"真实存在"的编号做成标签
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'cite';
          chip.textContent = '[' + n + ']';
          chip.addEventListener('click', function () { focusSource(hit); });
          answerEl.appendChild(chip);
          cited.push(n);
          return;
        }
      }
      answerEl.appendChild(document.createTextNode(part));   // 普通文字
    });

    // 被引用过的来源卡片加个标记（边框变绿）
    cited.forEach(function (n) {
      const el = sourcesBox.querySelector('.source[data-index="' + n + '"]');
      if (el) el.classList.add('cited');
    });
  }

  // 点击引用标签 → 把对应来源卡片滚到眼前、展开、闪一下
  function focusSource(el) {
    const text = el.querySelector('.source-text');
    if (text) text.classList.remove('clamped');
    const toggle = el.querySelector('.source-toggle');
    if (toggle) toggle.textContent = '收起';

    el.classList.add('flash');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(function () { el.classList.remove('flash'); }, 1200);
  }

  // 渲染来源清单：编号 + 相关度分数 + 可展开的完整原文
  function renderSources(container, sources, note) {
    const box = document.createElement('div');
    box.className = 'sources';
    container.appendChild(box);              // 先挂进页面，后面只管往里加东西

    if (note) {
      const warn = document.createElement('div');
      warn.className = 'src-note';
      warn.textContent = '提示：' + note;
      box.appendChild(warn);
    }
    if (!sources || sources.length === 0) return box;

    const hd = document.createElement('div');
    hd.className = 'sources-hd';
    hd.textContent = '引用来源（点答案里的 [n] 可以跳到这里）';
    box.appendChild(hd);

    sources.forEach(function (s) {
      const item = document.createElement('div');
      item.className = 'source';
      item.setAttribute('data-index', s.index);   // 答案里的 [n] 靠这个找到它

      const title = document.createElement('div');
      title.className = 'source-hd';
      const scoreTxt = (s.score === null || s.score === undefined)
        ? '未重排'
        : '相关度 ' + s.score.toFixed(2);
      title.textContent = '[' + s.index + '] ' + s.file
        + (s.location ? ' · ' + s.location : '') + ' · ' + scoreTxt;

      const text = document.createElement('div');
      text.className = 'source-text clamped';     // 默认折叠成 3 行
      text.textContent = s.text;

      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'source-toggle';
      toggle.textContent = '展开全文';
      toggle.addEventListener('click', function () {
        const folded = text.classList.toggle('clamped');
        toggle.textContent = folded ? '展开全文' : '收起';
      });

      item.appendChild(title);
      item.appendChild(text);
      item.appendChild(toggle);
      box.appendChild(item);
    });

    return box;
  }

  // ============================================================
  // 读 SSE 流：把一帧 "event: xxx\ndata: {...}" 拆成 {event, data}
  // ============================================================
  function parseFrame(frame) {
    let event = 'message';
    const dataLines = [];
    for (const line of frame.split('\n')) {
      if (line.startsWith('event:')) event = line.slice(6).trim();
      else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
    }
    if (dataLines.length === 0) return null;
    return { event: event, data: JSON.parse(dataLines.join('\n')) };
  }

  // ============================================================
  // 「思考中…」提示条
  // ============================================================
  // 三个点单独用元素包起来，才能让它们"轮流亮"。
  // （如果用 innerHTML 拼一串字符，就没法单独控制每一个点。）
  function makeThinking() {
    const el = document.createElement('div');
    el.className = 'thinking';
    el.appendChild(document.createTextNode('思考中'));
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.textContent = '.';
      el.appendChild(dot);
    }
    return el;
  }

  // 流结束时后端会发一条 done，里面带着「本轮用量」和「记忆占用」
  function renderDone(data) {
    const parts = [];
    const u = data && data.usage;
    const c = data && data.context;

    if (u && typeof u.input_tokens === 'number') {
      const yuan = (typeof u.cost === 'number') ? ' · 约 ¥' + u.cost.toFixed(4) : '';
      parts.push('本轮用量：输入 ' + u.input_tokens + ' · 输出 ' + u.output_tokens
                 + ' tokens' + yuan + (u.estimated ? '（估算）' : ''));
    }
    if (c) {
      parts.push('记忆占用 ' + c.used + '/' + c.max + ' 条'
                 + (c.full ? ' · 更早的对话已不再参与回答' : ''));
    }

    ctxLine.textContent = parts.join('　·　');
    ctxLine.className = 'ctx-line' + (c && c.full ? ' full' : '');
  }

  // ============================================================
  // 提问：发出去之后不再等一整份 JSON，而是边收边显示
  // ============================================================
  async function ask(q) {
    addMessage(q, 'user');

    // 先摆好气泡：一个"思考中"提示 + 一个空的答案区，等着往里塞字
    const bubble = addMessage('', 'bot');
    const thinkingEl = makeThinking();
    bubble.appendChild(thinkingEl);
    const answerEl = document.createElement('div');
    answerEl.className = 'answer';
    bubble.appendChild(answerEl);
    bubble.scrollIntoView({ behavior: 'smooth', block: 'start' });

    let sourcesBox = null;
    let fullText = '';
    let problem = '';

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, session_id: sessionId }),
      });

      // 只有"还没开始流"的错误才会走到这里（比如知识库是空的）
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        throw new Error(d.detail || '请求失败');
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        // SSE 用空行分隔一条条消息，所以按 \n\n 切开
        let idx;
        while ((idx = buffer.indexOf('\n\n')) !== -1) {
          const frame = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);

          const msg = parseFrame(frame);
          if (!msg) continue;

          if (msg.event === 'sources') {
            sourcesBox = renderSources(bubble, msg.data.sources, msg.data.note);
          } else if (msg.event === 'token') {
            // 第一个字到了：撤掉"思考中"，换上闪烁光标
            thinkingEl.remove();               // 已经移掉了再调一次也没事
            bubble.classList.add('streaming'); // 重复加也不会出问题
            fullText += msg.data.t;
            answerEl.textContent = fullText;   // 逐字追加，这就是"流式"
          } else if (msg.event === 'done') {
            renderDone(msg.data);              // 更新「用量 + 记忆占用」那行小字
          } else if (msg.event === 'error') {
            problem = msg.data.detail;         // 中途出错，流里会发一条 error 事件过来
          }
        }
      }
    } catch (err) {
      problem = err.message;
    } finally {
      // 不管成功、失败还是中途卡住，这两样都得撤掉
      thinkingEl.remove();
      bubble.classList.remove('streaming');    // 光标
    }

    if (problem) fullText += (fullText ? '\n\n' : '') + '[出错] ' + problem;
    if (!fullText) fullText = '（模型没有返回任何内容）';

    // 流结束，整体重渲染一次 —— 这一步才把 [n] 变成可点标签。
    // 为什么不在流的过程中就做？因为一边收字一边重排 DOM 又复杂又容易出错。
    if (sourcesBox) renderAnswer(answerEl, fullText, sourcesBox);
    else answerEl.textContent = fullText;

    // 这一轮聊完，历史列表要刷一下：新增了会话、或当前会话的时间/条数都变了
    loadSessionList();
  }

  // 「新对话」：换一个新编号，页面清空
  newChatBtn.addEventListener('click', async () => {
    const oldId = sessionId;
    sessionId = crypto.randomUUID();
    localStorage.setItem(SESSION_KEY, sessionId);   // 换号要写回去，否则下次刷新又捡起旧编号
    messages.innerHTML = '<p class="empty">还没有对话。先上传文档，然后在这里提问。</p>';
    ctxLine.textContent = '';
    try {
      await fetch('/session/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: oldId }),
      });
    } catch (e) {
      // 清不掉也不要紧：就算后端还留着，它迟早会被 MAX_SESSIONS 挤掉
    }
    loadSessionList();     // 新会话还没内容，列表里暂时不会出现它
  });

  // ============================================================
  // 模型设置：读 / 存 / 测试
  // ============================================================
  const presetSel = document.getElementById('presetSel');
  const presetHint = document.getElementById('presetHint');
  const setBaseUrl = document.getElementById('setBaseUrl');
  const setModel = document.getElementById('setModel');
  const setApiKey = document.getElementById('setApiKey');
  const testBtn = document.getElementById('testBtn');
  const saveBtn = document.getElementById('saveBtn');
  const settingsStatus = document.getElementById('settingsStatus');
  const curModel = document.getElementById('curModel');
  let settingsData = null;    // 后端返回的脱敏设置

  function findPreset(pid) {
    if (!settingsData) return null;
    return settingsData.presets.find(function (p) { return p.id === pid; }) || null;
  }

  // 把"某一家"的配置填进表单 —— 方案 A 的核心：
  // 切到哪家，就把它存过的地址/模型/密钥状态带出来
  function fillForm(pid) {
    if (!settingsData) return;
    const saved = settingsData.current.providers[pid] || null;   // 这家存过的
    const preset = findPreset(pid);

    if (saved) {
      setBaseUrl.value = saved.base_url || '';
      setModel.value = saved.model || '';
    } else if (preset) {
      setBaseUrl.value = preset.base_url;   // 没存过就用预设默认值打底
      setModel.value = preset.model;
    } else {
      setBaseUrl.value = '';
      setModel.value = '';
    }

    // 密钥永远不填进来（后端根本不回传真值）。留空 = 不改这把。
    setApiKey.value = '';
    setApiKey.placeholder = (saved && saved.has_key)
      ? '已配置（留空表示不修改）'
      : '这家还没配密钥，请粘贴';
    presetHint.textContent = preset ? preset.hint : '手填地址和模型名即可，配置会存到「自定义」里';
  }

  function collect() {
    return {
      provider: presetSel.value,
      base_url: setBaseUrl.value.trim(),
      model: setModel.value.trim(),
      api_key: setApiKey.value.trim(),
    };
  }

  function setSetStatus(text, type) {
    settingsStatus.textContent = text;
    settingsStatus.className = 'status' + (type ? ' ' + type : '');
  }

  async function loadSettings() {
    try {
      const res = await fetch('/settings');
      settingsData = await res.json();

      presetSel.innerHTML = '';
      settingsData.presets.forEach(function (p) {
        const opt = document.createElement('option');
        opt.value = p.id;                 // value 直接放"门牌号"
        opt.textContent = p.name;
        presetSel.appendChild(opt);
      });
      const custom = document.createElement('option');
      custom.value = settingsData.custom_id;
      custom.textContent = '（自定义）';
      presetSel.appendChild(custom);

      // 关键修复：按"现在用的是哪家"反选中下拉项，而不是永远停在第一项
      const cur = settingsData.current.current;
      presetSel.value = findPreset(cur) ? cur : settingsData.custom_id;

      fillForm(presetSel.value);

      const curCfg = settingsData.current.providers[cur] || null;
      curModel.textContent = (curCfg ? curCfg.model : '未配置')
        + (curCfg && curCfg.has_key ? '' : '（未配密钥）');
    } catch (e) {
      setSetStatus('读取设置失败：' + e.message, 'err');
    }
  }

  // 换一家 → 把这家存过的配置带出来（这就是方案 A 的核心体验）
  presetSel.addEventListener('change', function () {
    fillForm(presetSel.value);
    setSetStatus('');
  });

  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    setSetStatus('正在保存…');
    try {
      const res = await fetch('/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(collect()),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '保存失败');
      setSetStatus('✓ ' + data.msg, 'ok');
      loadSettings();
    } catch (e) {
      setSetStatus('保存失败：' + e.message, 'err');
    } finally {
      saveBtn.disabled = false;
    }
  });

  testBtn.addEventListener('click', async () => {
    testBtn.disabled = true;
    setSetStatus('正在测试连接…（免费模型高峰期可能要等几秒）');
    try {
      const res = await fetch('/settings/test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(collect()),
      });
      const data = await res.json();
      setSetStatus((data.ok ? '✓ ' : '✗ ') + data.msg, data.ok ? 'ok' : 'err');
    } catch (e) {
      setSetStatus('测试失败：' + e.message, 'err');
    } finally {
      testBtn.disabled = false;
    }
  });

  loadSettings();   // 页面一打开就载入当前设置

  // 读取知识库里已有的文件，显示成一张清单
  async function loadDocuments() {
    try {
      const res = await fetch('/documents');
      const data = await res.json();
      docList.innerHTML = '';
      if (!data.files || data.files.length === 0) {
        docList.innerHTML = '<div class="doc-empty">知识库还是空的，上传一份文档试试。</div>';
        return;
      }
      data.files.forEach(function (f) {
        const row = document.createElement('div');
        row.className = 'doc-item';
        const name = document.createElement('span');
        name.textContent = f.file;
        const count = document.createElement('span');
        count.className = 'doc-count';
        count.textContent = f.chunk_num + ' 段';
        row.appendChild(name);
        row.appendChild(count);
        const del = document.createElement('button');
        del.className = 'doc-del';
        del.textContent = '删除';
        del.addEventListener('click', function () {
          deleteDocument(f.file);
        });
        row.appendChild(del);
        docList.appendChild(row);
      });
    } catch (e) {
      docList.innerHTML = '<div class="doc-empty">读取知识库失败：' + e.message + '</div>';
    }
  }

  loadDocuments();   // 页面一打开就先读一次

  // 删除某个文件
  async function deleteDocument(name) {
    if (!confirm('确定要从知识库里删除「' + name + '」吗？')) return;
    try {
      const res = await fetch('/documents?file=' + encodeURIComponent(name), { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '删除失败');
      loadDocuments();
    } catch (e) {
      alert('删除失败：' + e.message);
    }
  }

  uploadBtn.addEventListener('click', async () => {
    const file = fileInput.files[0];
    if (!file) {
      setStatus('请先选择一份文件。', 'err');
      return;
    }
    uploadBtn.disabled = true;
    setStatus('正在解析并建立向量库，请稍候…');
    try {
      const form = new FormData();
      form.append('file', file);
      const res = await fetch('/upload', { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '上传失败');
      setStatus('入库成功："' + file.name + '" 切成 ' + data.chunk_num + ' 段；向量库里现在共 ' + data.total + ' 段。可以继续传别的文件，也可以直接提问。', 'ok');
      loadDocuments();
    } catch (e) {
      setStatus('上传失败：' + e.message, 'err');
    } finally {
      uploadBtn.disabled = false;
    }
  });

  askForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = questionInput.value.trim();
    if (!q) return;

    questionInput.value = '';
    askBtn.disabled = true;
    try {
      await ask(q);          // 成功失败都会把结果写进气泡里，不用在这里再处理
    } finally {
      askBtn.disabled = false;
      questionInput.focus();
    }
  });

  // ============================================================
  // 页面一打开：认回上次那个会话，并把聊过的内容显示出来
  // ============================================================
  // 这两句是"记忆能被人看见"的关键 —— 少了它们，服务端存着再多历史，
  // 用户看到的也永远是一张白纸。
  loadHistory();       // 把当前会话的消息还原到聊天区
  loadSessionList();   // 列出全部历史会话，好让用户点进去接着聊
</script>
</body>
</html>
